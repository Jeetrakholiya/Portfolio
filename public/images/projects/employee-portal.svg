      <text x="320" y="180" fill="#94a3b8" font-family="sans-serif" font-size="12">Software Engineering</text>
      <text x="500" y="180" fill="#94a3b8" font-family="sans-serif" font-size="12">Lead Architect</text>
      <text x="680" y="180" fill="#10b981" font-family="monospace" font-size="11">● Active</text>

      <text x="30" y="230" fill="#38bdf8" font-family="monospace" font-size="11">#EMP-0843</text>
      <text x="130" y="230" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Elena Rostova</text>
      <text x="320" y="230" fill="#94a3b8" font-family="sans-serif" font-size="12">Database Administration</text>
      <text x="500" y="230" fill="#94a3b8" font-family="sans-serif" font-size="12">SQL Specialist</text>
      <text x="680" y="230" fill="#10b981" font-family="monospace" font-size="11">● Active</text>

      <text x="30" y="280" fill="#38bdf8" font-family="monospace" font-size="11">#EMP-0844</text>
      <text x="130" y="280" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Marcus Chen</text>
      <text x="320" y="280" fill="#94a3b8" font-family="sans-serif" font-size="12">Security Operations</text>
      <text x="500" y="280" fill="#94a3b8" font-family="sans-serif" font-size="12">Auth Manager</text>
      <text x="680" y="280" fill="#10b981" font-family="monospace" font-size="11">● Active</text>
