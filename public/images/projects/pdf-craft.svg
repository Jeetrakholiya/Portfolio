<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="pdfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="url(#pdfBg)" />

  <!-- Subtle Blueprint Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
  </pattern>
  <rect width="1200" height="750" fill="url(#grid)" />

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="1200" height="50" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
  <circle cx="30" cy="25" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="50" cy="25" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="70" cy="25" r="6" fill="#10b981" opacity="0.8" />

  <!-- URL Pill -->
  <rect x="180" y="10" width="840" height="30" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
  <text x="210" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    🔒 https://pdf-craft-oprs.vercel.app — Next-Gen Document &amp; PDF Suite
  </text>
  <rect x="940" y="15" width="70" height="20" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="0.8" />
  <text x="952" y="29" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">LIVE VERCEL</text>

  <!-- Main Navbar -->
  <g transform="translate(60, 75)">
    <!-- Logo -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#accentGrad)" />
    <path d="M12 10 h12 v16 h-12 z M15 14 h6 M15 18 h6 M15 22 h4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="48" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">
      PDF<tspan fill="#38bdf8">Craft</tspan>
    </text>
    <rect x="150" y="5" width="90" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <circle cx="162" cy="16" r="3.5" fill="#38bdf8" />
    <text x="172" y="20" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="600">JWT AUTH</text>

    <!-- Nav Links -->
    <text x="750" y="23" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Tools</text>
    <text x="820" y="23" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Security</text>
    <text x="900" y="23" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">API</text>
    <rect x="960" y="2" width="120" height="32" rx="6" fill="#38bdf8" />
    <text x="990" y="22" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Get Started</text>
  </g>

  <!-- Hero Section Content -->
  <g transform="translate(60, 145)">
    <!-- Badge -->
    <rect x="0" y="0" width="260" height="28" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">
      ⚡ Client-Side Fast &amp; 100% Secure
    </text>

    <!-- Headline -->
    <text x="0" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">
      Craft, Convert &amp; Master Your PDFs
    </text>
    <text x="0" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="400">
      The next-generation document platform equipped with instant conversion, compression, visual editing &amp; AI insights.
    </text>
  </g>

  <!-- Drop Zone Hero Box -->
  <g transform="translate(60, 280)">
    <rect x="0" y="0" width="1080" height="150" rx="12" fill="url(#dropGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.6" />
    
    <circle cx="540" cy="55" r="24" fill="#0284c7" fill-opacity="0.2" />
    <path d="M540 43 v18 M532 51 l8 -8 8 8 M528 67 h24" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <text x="540" y="98" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      Drop your PDF file here
    </text>
    <text x="540" y="122" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">
      Supports PDF, Word, Excel, PowerPoint &amp; High-Res Images • Max 100MB
    </text>
  </g>

  <!-- Feature Tool Cards Grid (6 Live Tools) -->
  <g transform="translate(60, 460)">
    <!-- Card 1: Merge PDF -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="166" height="180" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.8" />
      <path d="M28 26 h12 v12 h-12 z M34 30 v4 M32 32 h4" stroke="#ef4444" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <text x="16" y="78" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Merge PDF</text>
      <text x="16" y="100" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="400">
        Combine multiple PDFs in custom exact order.
      </text>
      <rect x="16" y="138" width="80" height="22" rx="4" fill="#1e293b" />
      <text x="24" y="153" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">LAUNCH ↗</text>
    </g>

    <!-- Card 2: Split PDF -->
    <g transform="translate(182, 0)">
      <rect x="0" y="0" width="166" height="180" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8" />
      <path d="M26 28 h8 M38 28 h8 M34 24 v8" stroke="#f59e0b" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <text x="16" y="78" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Split PDF</text>
      <text x="16" y="100" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="400">
        Extract custom page ranges into high-res files.
      </text>
      <rect x="16" y="138" width="80" height="22" rx="4" fill="#1e293b" />
      <text x="24" y="153" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">LAUNCH ↗</text>
    </g>

    <!-- Card 3: Compress PDF -->
    <g transform="translate(364, 0)">
      <rect x="0" y="0" width="166" height="180" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8" />
      <path d="M30 26 l4 4 4 -4 M34 24 v10 M28 40 h12" stroke="#10b981" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <text x="16" y="78" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Compress</text>
      <text x="16" y="100" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="400">
        Shrink file size while keeping crisp clarity.
      </text>
      <rect x="16" y="138" width="80" height="22" rx="4" fill="#1e293b" />
      <text x="24" y="153" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">LAUNCH ↗</text>
    </g>

    <!-- Card 4: AI Summarizer -->
    <g transform="translate(546, 0)">
      <rect x="0" y="0" width="166" height="180" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="0.8" />
      <path d="M34 24 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2 z" stroke="#38bdf8" stroke-width="1.5" fill="#38bdf8" />
      <text x="16" y="78" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="800">AI Summary</text>
      <text x="16" y="100" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="400">
        Instant executive insights from large PDFs.
      </text>
      <rect x="16" y="138" width="80" height="22" rx="4" fill="#0284c7" />
      <text x="24" y="153" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">AI PRO ⚡</text>
    </g>

    <!-- Card 5: Visual Page Studio -->
    <g transform="translate(728, 0)">
      <rect x="0" y="0" width="166" height="180" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="0.8" />
      <path d="M28 26 h10 v8 h-10 z M34 32 h8 v8 h-8 z" stroke="#818cf8" stroke-width="1.5" fill="none" />
      <text x="16" y="78" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Page Studio</text>
      <text x="16" y="100" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="400">
        Drag, reorder, rotate canvas visually.
      </text>
      <rect x="16" y="138" width="80" height="22" rx="4" fill="#1e293b" />
      <text x="24" y="153" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">NEW ✨</text>
    </g>

    <!-- Card 6: E-Sign PDF -->
    <g transform="translate(910, 0)">
      <rect x="0" y="0" width="166" height="180" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="0.8" />
      <path d="M28 36 c3 -6 8 -10 14 -12 M32 30 l6 6" stroke="#ec4899" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <text x="16" y="78" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">E-Sign PDF</text>
      <text x="16" y="100" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="400">
        Draw, type or upload verified digital signs.
      </text>
      <rect x="16" y="138" width="80" height="22" rx="4" fill="#1e293b" />
      <text x="24" y="153" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">LAUNCH ↗</text>
    </g>
  </g>

  <!-- Bottom Global Metric Strip -->
  <rect x="60" y="670" width="1080" height="50" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
  <text x="90" y="700" fill="#94a3b8" font-family="monospace" font-size="12">
    ENGINE: <tspan fill="#38bdf8">Next.js 14</tspan> | AUTH: <tspan fill="#10b981">JWT Authenticated</tspan> | DEPLOYED: <tspan fill="#ffffff">Vercel Edge Platform</tspan>
  </text>
  <text x="940" y="700" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">
    pdf-craft-oprs.vercel.app ↗
  </text>
</svg>
