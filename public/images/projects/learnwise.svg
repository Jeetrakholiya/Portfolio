      <text x="0" y="150" fill="#484f58">07</text>
      <text x="75" y="150" fill="#f0f6fc">analysis =</text>
      <text x="165" y="150" fill="#ff7b72">await</text>
      <text x="215" y="150" fill="#79c0ff">gemini.evaluate</text>
      <text x="330" y="150" fill="#f0f6fc">(user_code)</text>

