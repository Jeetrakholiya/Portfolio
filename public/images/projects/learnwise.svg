      <text x="0" y="125" fill="#484f58">06</text>
      <text x="55" y="125" fill="#ff7b72">async def</text>
      <text x="135" y="125" fill="#d2a8ff">diagnose_code</text>
      <text x="235" y="125" fill="#f0f6fc">(self, user_code: str):</text>

