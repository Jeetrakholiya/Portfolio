      <rect x="15" y="105" width="340" height="28" rx="4" fill="#238636" fill-opacity="0.3" stroke="#3fb950" stroke-width="1" />
      <text x="25" y="123" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">B. Handles concurrent API tasks without thread starvation ✓</text>

      <!-- Option C -->
