<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="evBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021c15" />
    </linearGradient>
    <linearGradient id="evGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#evBg)" />
  <rect x="0" y="0" width="1200" height="50" fill="#021c15" stroke="#047857" stroke-width="0.8" />
  <circle cx="30" cy="25" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="50" cy="25" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="70" cy="25" r="6" fill="#10b981" opacity="0.8" />
  <text x="120" y="30" fill="#6ee7b7" font-family="monospace" font-size="12">
    METRO E-MOBILITY — SUSTAINABLE COMMERCIAL ELECTRIC FLEET PLATFORM
  </text>

  <!-- Navbar -->
  <g transform="translate(60, 80)">
    <text x="0" y="24" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" letter-spacing="1">
      METRO <tspan fill="#34d399">E-MOBILITY</tspan>
    </text>
    <text x="750" y="22" fill="#a7f3d0" font-family="sans-serif" font-size="13">Fleet Showcase</text>
    <text x="880" y="22" fill="#a7f3d0" font-family="sans-serif" font-size="13">Charging Grid</text>
    <rect x="990" y="2" width="90" height="30" rx="4" fill="url(#evGreen)" />
    <text x="1005" y="22" fill="#022c22" font-family="sans-serif" font-size="12" font-weight="800">Inquire ⚡</text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="190" height="26" rx="13" fill="#047857" fill-opacity="0.4" stroke="#10b981" stroke-width="0.8" />
    <text x="15" y="17" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">ZERO EMISSION TRANSIT</text>

    <text x="0" y="65" fill="#f0fdf4" font-family="sans-serif" font-size="38" font-weight="900">
      Powering The Next Generation
    </text>
    <text x="0" y="105" fill="url(#evGreen)" font-family="sans-serif" font-size="38" font-weight="900">
      Of Urban Clean Fleets.
    </text>
    <text x="0" y="135" fill="#a7f3d0" font-family="sans-serif" font-size="14">
      Commercial fleet management, high-capacity EV vehicle lineups, and responsive multi-page customer portal.
    </text>

    <!-- Cards Grid -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="340" height="320" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="1" />
      <rect x="20" y="20" width="300" height="160" rx="6" fill="#022c22" />
      <!-- EV Scooter / Vehicle Silhouette -->
      <circle cx="110" cy="110" r="30" fill="none" stroke="#34d399" stroke-width="4" />
      <circle cx="230" cy="110" r="30" fill="none" stroke="#34d399" stroke-width="4" />
      <path d="M110 110 L160 70 L210 70 L230 110" stroke="#34d399" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M160 70 L140 40 L120 40" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
      <text x="20" y="215" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Metro Sprint Pro EV</text>
      <text x="20" y="235" fill="#6ee7b7" font-family="sans-serif" font-size="12">120km Range • 4hr Fast Charge • Smart Telemetry</text>
      <rect x="20" y="260" width="130" height="32" rx="4" fill="url(#evGreen)" />
      <text x="40" y="281" fill="#022c22" font-family="sans-serif" font-size="11" font-weight="800">Explore Model →</text>

      <rect x="370" y="0" width="340" height="320" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="1" />
      <rect x="390" y="20" width="300" height="160" rx="6" fill="#022c22" />
      <!-- EV Cargo / Commercial Van -->
      <circle cx="470" cy="120" r="26" fill="none" stroke="#34d399" stroke-width="4" />
      <circle cx="610" cy="120" r="26" fill="none" stroke="#34d399" stroke-width="4" />
      <rect x="440" y="55" width="190" height="65" rx="4" fill="none" stroke="#34d399" stroke-width="4" />
      <text x="390" y="215" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Metro Cargo Ultra</text>
      <text x="390" y="235" fill="#6ee7b7" font-family="sans-serif" font-size="12">850kg Payload • Heavy-Duty Lithium Cell</text>
      <rect x="390" y="260" width="130" height="32" rx="4" fill="url(#evGreen)" />
      <text x="410" y="281" fill="#022c22" font-family="sans-serif" font-size="11" font-weight="800">Explore Model →</text>

      <rect x="740" y="0" width="340" height="320" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="1" />
      <rect x="760" y="20" width="300" height="160" rx="6" fill="#022c22" />
      <!-- Charging Station Symbol -->
      <rect x="880" y="50" width="40" height="80" rx="4" fill="none" stroke="#34d399" stroke-width="4" />
      <path d="M895 70 l10 15 h-8 l6 20" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="760" y="215" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Grid Hub Network</text>
      <text x="760" y="235" fill="#6ee7b7" font-family="sans-serif" font-size="12">High-Voltage DC Fast Charging Infrastructure</text>
      <rect x="760" y="260" width="130" height="32" rx="4" fill="url(#evGreen)" />
      <text x="780" y="281" fill="#022c22" font-family="sans-serif" font-size="11" font-weight="800">Station Locator →</text>
    </g>
  </g>
</svg>
