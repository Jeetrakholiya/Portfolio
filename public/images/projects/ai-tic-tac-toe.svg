<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="tttBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#tttBg)" />
  
  <rect x="0" y="0" width="1200" height="50" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <circle cx="30" cy="25" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="50" cy="25" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="70" cy="25" r="6" fill="#10b981" opacity="0.8" />
  <text x="120" y="30" fill="#a1a1aa" font-family="monospace" font-size="12">
    AI TIC-TAC-TOE — MINIMAX ALGORITHMIC GAME STATE ENGINE (PYTHON / JAVASCRIPT)
  </text>

  <!-- Game Board and AI Decision Tree -->
  <g transform="translate(100, 100)">
    <!-- Board -->
    <rect x="0" y="0" width="480" height="480" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <!-- Grid Lines -->
    <line x1="160" y1="20" x2="160" y2="460" stroke="#52525b" stroke-width="4" stroke-linecap="round" />
    <line x1="320" y1="20" x2="320" y2="460" stroke="#52525b" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="160" x2="460" y2="160" stroke="#52525b" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="320" x2="460" y2="320" stroke="#52525b" stroke-width="4" stroke-linecap="round" />

    <!-- Moves -->
    <!-- X at 0,0 -->
    <path d="M50 50 L110 110 M110 50 L50 110" stroke="#00f59b" stroke-width="8" stroke-linecap="round" />
    <!-- O at 1,1 -->
    <circle cx="240" cy="240" r="35" fill="none" stroke="#38bdf8" stroke-width="8" />
    <!-- X at 2,0 -->
    <path d="M370 50 L430 110 M430 50 L370 110" stroke="#00f59b" stroke-width="8" stroke-linecap="round" />
    <!-- O at 0,1 -->
    <circle cx="80" cy="240" r="35" fill="none" stroke="#38bdf8" stroke-width="8" />
    <!-- X at 1,0 (Winning Line Simulation) -->
    <path d="M210 50 L270 110 M270 50 L210 110" stroke="#00f59b" stroke-width="8" stroke-linecap="round" />
    
    <!-- Winning Strike Line -->
    <line x1="30" y1="80" x2="450" y2="80" stroke="#00f59b" stroke-width="6" stroke-linecap="round" filter="drop-shadow(0 0 8px #00f59b)" />

    <!-- AI Evaluation Panel -->
    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="470" height="480" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
      <text x="25" y="45" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">
        AI DECISION TELEMETRY
      </text>
      <text x="25" y="70" fill="#a1a1aa" font-family="monospace" font-size="11">
        MINIMAX OPTIMAL COUNTER-MOVE COMPUTATION
      </text>

      <rect x="25" y="95" width="420" height="110" rx="8" fill="#27272a" />
      <text x="45" y="125" fill="#00f59b" font-family="monospace" font-size="12" font-weight="700">DEPTH SCORE: +10 (VICTORY IMMINENT)</text>
      <text x="45" y="150" fill="#d4d4d8" font-family="sans-serif" font-size="13">Explored 59,049 branch states in 1.4ms.</text>
      <text x="45" y="175" fill="#71717a" font-family="monospace" font-size="11">Optimal Move Selected: [0, 1] Blocking Counter</text>

      <rect x="25" y="225" width="420" height="220" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <text x="45" y="255" fill="#38bdf8" font-family="monospace" font-size="11">def minimax(state, depth, is_maximizing):</text>
      <text x="65" y="280" fill="#a1a1aa" font-family="monospace" font-size="11">if check_win(state, 'X'): return 10 - depth</text>
      <text x="65" y="305" fill="#a1a1aa" font-family="monospace" font-size="11">if check_win(state, 'O'): return depth - 10</text>
      <text x="65" y="330" fill="#a1a1aa" font-family="monospace" font-size="11">if is_board_full(state): return 0</text>
      <text x="65" y="365" fill="#00f59b" font-family="monospace" font-size="11"># Alpha-Beta Pruning Optimization</text>
      <text x="65" y="390" fill="#e4e4e7" font-family="monospace" font-size="11">best_score = max(scores, alpha, beta)</text>
    </g>
  </g>
</svg>
